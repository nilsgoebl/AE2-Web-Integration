<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:wght@300;400&display=swap');
        *,html,body{
            margin: 0;
            padding: 0;
            font-family: "Montserrat", sans-serif;
            font-optical-sizing: auto;
            font-style: normal;
            color: #e0e0e0;
            font-weight: 400;
        }
        b{
            font-weight: 500;
        }
        body{
            background-color: #101219;
            color: #e0e0e0;
        }
        html,body{
            height: 100%;
            width: 100%;
        }
        td{
            padding: 10px;
            word-wrap: break-word;
            border: 3px #232e53 solid;
            border-radius: 1px;
        }
        td.active{
            background-color: rgb(73, 105, 20);
            border-color: rgb(53, 77, 14);
        }
        td.pending{
            background-color: rgb(92, 92, 15);
            border-color: rgb(71, 71, 11);
        }
        td.storage{
            background-color: #2b3555;
        }
        .item-grid{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 6px;
            padding: 5px;
        }
        .item-card{
            padding: 10px;
            min-width: 0;
            word-wrap: break-word;
            border: 3px #232e53 solid;
            border-radius: 1px;
        }
        .item-card.active{
            background: linear-gradient(rgba(69, 160, 33, 0.35), rgba(69, 160, 33, 0.35)), #2b3555;
            border-color: #45A021;
        }
        .item-card.pending{
            background: linear-gradient(rgba(255, 247, 170, 0.35), rgba(255, 247, 170, 0.35)), #2b3555;
            border-color: #FFF7AA;
        }
        .item-card.storage{
            background-color: #2b3555;
        }
        .item-card.missing{
            background-color: rgb(112, 0, 0);
            border-color: rgb(85, 0, 0);
        }
        .item-card.reason-stuck{
            background: linear-gradient(rgba(201, 165, 58, 0.35), rgba(201, 165, 58, 0.35)), #2b3555;
            border-color: #C9A53A;
        }
        .item-card.reason-error{
            background: linear-gradient(rgba(224, 112, 112, 0.35), rgba(224, 112, 112, 0.35)), #2b3555;
            border-color: #E07070;
        }
        .item-card .storage-icon-row{
            min-height: 48px;
        }
        .scheduled-reason{
            color: #FFFF55;
        }
        .storage-icon-row{
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .storage-item-details{
            flex: 1 1 auto;
            min-width: 0;
        }
        #terminalCPUList button{
            position: relative;
            text-align: left;
            min-height: 54px;
            padding-right: 58px;
        }
        .cpu-name-line, .cpu-job-line{
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .cpu-job-line img.item-icon{
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
        }
        .cpu-job-details{
            min-width: 0;
        }
        .website-origin-icon{
            display: inline-flex;
            align-items: center;
            line-height: 1;
            font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
        }
        .crafting-plan-layout{
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .crafting-plan-result{
            flex: 0 0 150px;
            text-align: center;
        }
        .crafting-plan-result img.item-icon{
            display: block;
            margin: 6px auto;
        }
        .crafting-plan-items{
            flex: 1 1 auto;
            min-width: 0;
        }
        td.missing{
            background-color: rgb(112, 0, 0);
            border-color: rgb(85, 0, 0);
        }
        td.storage img.item-icon{
            flex: 0 0 48px;
            width: 48px;
            height: 48px;
        }
        .item-card img.item-icon{
            flex: 0 0 48px;
            width: 48px;
            height: 48px;
        }
        body>h1{
            text-align: center;
            letter-spacing: 10px;
            font-weight: 800;
            color: #fff;
            font-size: 2.5em;
        }

        #terminalcontainer{
            width: 90%;
            min-height: 90%;
            border: black solid 1px;
            margin: 0 auto;
            border-collapse: collapse;
            display: flex;
        }

        #terminalgrid{
            width: 90%;
            margin: 0 auto;
            border: black solid 1px;
            border-collapse: collapse;
            display: flex;
            flex-direction: column;
        }
        #terminalgrid>*{
            display: flex;
            flex-direction: column;
            margin: 10px;
        }

        button{
            background-color: #292f47;
            border: 0;
            border-radius: 5px;
            padding: 5px;
            transition: 0.2s;
        }
        button:hover{
            background-color: #363e5e;
            cursor: pointer;
        }

        .redtext{
            color:rgb(170, 0, 0);
        }

        #terminaltypes{
            width: 10%;
            min-height: 100%;
            border-right: black solid 1px;
            float: left;
        }
        #terminaltypes button{
            width: calc(100% - 10px);
            margin: 5px 5px;
            font-size: 110%;
        }

        #terminalwindow{
            width: 90%;
            float: left;
        }

        #terminalheader{
            width: calc(100% - 20px);
            min-height: 40px;
            height: fit-content;
            border-bottom: black solid 1px;
            font-size: 150%;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        #terminalnav{
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-bottom: black solid 1px;
            background-color: #1a1f31;
        }
        #terminalnav button{
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 0;
            font-size: 110%;
        }
        #terminalnav .terminal-nav-tab.active{
            background-color: rgb(0, 137, 155);
        }
        #terminalnav .terminal-nav-refresh{
            margin-left: auto;
        }
        .terminal-nav-icon{
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            font-size: 21px;
            line-height: 1;
        }
        .terminal-nav-icon.terminal-nav-me{
            border: 1px solid #9db5f8;
            border-radius: 3px;
            color: #9db5f8;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
        }
        .terminal-nav-crafting-icon,
        .terminal-nav-terminal-icon{
            width: 24px;
            height: 24px;
            image-rendering: pixelated;
        }
        .terminal-nav-icon-fallback{
            display: none;
        }
        .filter-icon{
            position: relative;
            display: block;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 10px solid #e0e0e0;
        }
        .filter-icon:after{
            content: '';
            position: absolute;
            top: -10px;
            left: -2px;
            width: 4px;
            height: 7px;
            background-color: #e0e0e0;
        }
        input, select {
            background-color: #2b3555;
            accent-color: #9b59b6;
            border: 0;
            padding: 5px;
            border-radius: 5px;
        }
        #terminalheader input{
            font-size: 100%;
            background-color: #2b3555;
            border: 0;
            border-radius: 5px;
            transition: 0.2s;
            padding: 5px;
        }
        #terminalheader input:hover{
            background-color: #384572;
        }
        #terminalheader > section{
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        #terminalheader button{
            font-size: 110%;
            float: none;
            margin: 0;
        }
        #terminalTerminalHeader input{
            flex: 1 1 220px;
        }
        #terminalcontent{
            width: 100%;
            min-height: 95%;
        }
        #terminalSettingsView{
            padding: 10px;
        }
        #terminalSettingsView > section{
            margin-bottom: 16px;
        }
        #terminalSettingsView .settings-title{
            display: block;
            margin-bottom: 8px;
            font-size: 130%;
            font-weight: 500;
        }
        #terminalSettingsView .settings-controls > *{
            margin: 5px 0;
        }
        #terminalcontent table{
            width: 100%;
            table-layout: fixed;
        }
        #terminalcontent td{
            height: auto;
        }
        #terminalcontent td.button{
            background-color: #2b3555;
            border: 0;
            border-radius: 2px;
            padding: 5px;
            transition: 0.2s;
        }
        #terminalcontent td.button:hover{
            background-color: #3b4874;
            cursor: pointer;
        }
        #terminalsubcontainer{
            width: 10%;
            float: left;
            border-left: solid black 1px;
            font-size: 110%;
        }

        #terminalsubcontainer header{
            border-bottom: black dotted 1px;
            display: block;
            width: 100%;
            text-align: center;
            font-size: 130%;
            font-weight: 500;
            margin-bottom: 10px;
        }
        #terminalsubcontainer section{
            text-align: center;
        }
        #terminalsubcontainer > * > section > *{
            margin: 5px auto;
        }

        #terminalCPUList button, #terminalCPUListForJob button{
            width: 100%;
            margin: 0;
            border-bottom: black dotted 1px;
            word-wrap: break-word;
        }
        #terminalCPUList button.selected, #terminalCPUListForJob button.selected{
            background-color: rgb(0, 137, 155);
        }
        #terminalCPUListForJob button.invalid{
            background-color: rgb(155, 23, 0);
        }
        #terminalCPUListForJob button.mergable{
            background-color: rgb(170, 159, 0);
        }
        #terminalCPUListForJob button.mergable.selected{
            background-color: rgb(0, 165, 194);
        }

        #terminalHistoryDetails{
            padding: 5px;
        }

        #overlay {
            position: fixed;
            display: none;
            top: 10px;
            right: 10px;
            z-index: 3;
            max-width: 320px;
            padding: 7px 10px;
            border: 1px solid #52618f;
            border-radius: 4px;
            background-color: rgba(35, 46, 83, 0.96);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }
        #overlay>#overlaytext{
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            color: #e0e0e0;
        }
        #overlay>#overlaytext:before{
            content: '';
            width: 12px;
            height: 12px;
            border: 2px solid #9db5f8;
            border-top-color: transparent;
            border-radius: 50%;
            animation: loading-spinner 0.8s linear infinite;
        }
        @keyframes loading-spinner{
            to { transform: rotate(360deg); }
        }

        #alertoverlay {
            position: fixed;
            display: flex;
            flex-direction: column;
            width: 15%;
            height: fit-content;
            top: 5px;
            left: 5px;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0);
            z-index: 2;
        }
        #alertoverlay > *{
            width: 100%;
            border: black solid 1px;
            border-radius: 5px;
            background-color: #cc404049;
            padding: 10px;
            cursor: pointer;
        }

        #alertoverlay > *::after{
            content: "X";
            float: right;
            color: #e0e0e0;

        }

        #topMessages{
            position: fixed;
            width: 100%;
            text-align: center;
            background-color: #929292;
            transition: 0.2s;
        }

        #topMessages > *{
            display: block;
            text-align: center;
            margin: 10px 0;
            font-size: 130%;
        }

        #topMessages > * > button{
            float: right;
            margin-right: 10px;
        }


        footer {
            position: fixed;
            Width: 100%;
            bottom: 0;
            background-color: #9292926b;
            padding: 10px;
            transition: 0.2s;
        }

        footer:hover{
            background-color: #929292;
        }

        .note{
            color: rgb(80, 80, 80);
            font-style: italic;
            font-size: 90%;
        }
        .note::before{
            content: "ⓘ ";
        }

        a{
            color: #80cbc4;
            transition: 0.2s;
        }

        a:hover{
            color: #a7ffeb;
            text-decoration: underline;
        }

        option:disabled{
            color: rgb(170, 170, 170);
        }
        option:checked{
            color: light-dark(rgb(16, 16, 16), rgb(255, 255, 255));
        }

        .minecraftSpecialFormat_0{
            color: #000;
        }

        .minecraftSpecialFormat_1{
            color: #0000AA;
        }

        .minecraftSpecialFormat_2{
            color: #00AA00;
        }

        .minecraftSpecialFormat_3{
            color: #00AAAA;
        }

        .minecraftSpecialFormat_4{
            color: #AA0000;
        }

        .minecraftSpecialFormat_5{
            color: #AA00AA;
        }

        .minecraftSpecialFormat_6{
            color: #FFAA00;
        }

        .minecraftSpecialFormat_7{
            color: #AAAAAA;
        }

        .minecraftSpecialFormat_8{
            color: #555555;
        }

        .minecraftSpecialFormat_9{
            color: #5555FF;
        }

        .minecraftSpecialFormat_a{
            color: #55FF55;
        }

        .minecraftSpecialFormat_b{
            color: #55FFFFFF;
        }

        .minecraftSpecialFormat_c{
            color: #FF5555;
        }

        .minecraftSpecialFormat_d{
            color: #FF55FF;
        }

        .minecraftSpecialFormat_e{
            color: #FFFF55;
        }

        .minecraftSpecialFormat_f{
            color: #FFFFFF;
        }

        .minecraftSpecialFormat_k{
            /* no implementation? */
        }

        .minecraftSpecialFormat_l{
            font-weight: bold;
        }

        .minecraftSpecialFormat_m{
            text-decoration: line-through;
        }

        .minecraftSpecialFormat_n{
            text-decoration: underline;
        }

        .minecraftSpecialFormat_o{
            font-style: italic;
        }

        .minecraftSpecialFormat_r{
            color: black;
        }

        .collapsible:after {
            content: '\02795';
            font-size: 13px;
            color: #e0e0e0;
            margin-left: 5px;
        }

        .collapsible.active:after {
            content: "\2796";
        }

        .mobile-only{
            display: none;
        }

        @media screen and (max-width: 1300px){
            body{
                font-size: 12px;
            }
        }

        @media screen and (max-width: 1000px){
            body>h1{
                margin: 12px 8px;
                font-size: 1.5em;
                letter-spacing: 3px;
            }
            #terminalheader{
                border-top: black solid 1px;
            }
            #terminalheader > *{
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 6px;
            }
            #terminalnav{
                padding: 6px;
            }
            #terminalnav .terminal-nav-label{
                display: none;
            }
            #terminalnav button{
                min-width: 36px;
                justify-content: center;
            }
            #terminalTerminalHeader > input{
                width: auto;
                flex: 1 1 180px;
            }
            #terminalTerminalHeader .mobile-terminal-options{
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 36px !important;
                min-width: 36px;
                margin: 0;
                font-size: 100% !important;
            }
            #terminalheader:first-child{
                text-align: center;
                font-size: 200% !important;
                font-weight: bold !important;
            }
            #terminalheader > * > input{
                width: 100%;
                margin: 0;
            }
            #terminalsubcontainer{
                width: 100%;
                float: none;
                order: 2;
                border-left: none;
                border-top: black solid 1px;
            }
            #terminalsubcontainer header{
                border-bottom: none;
                display: block;
                width: 100%;
                text-align: center;
                font-size: 130%;
                font-weight: 500;
                margin-bottom: 10px;
            }
            #terminaltypes{
                width: 100%;
                float: none;
                order: 1;
            }
            #terminalwindow{
                width: 100%;
                float: none;
                order: 3;
            }
            #terminalcontainer{
                width: 100%;
                display: flex;
                flex-direction: column;
            }
            #terminalgrid {
                width: 100%;
                display: flex;
                flex-direction: column;
            }
            #terminalgrid > *{
                width: calc(100% - 10px) !important;
                margin: 5px 5px;
                margin-top: 10px !important;
                font-size: 150% !important;
            }
            #terminaltypes button{
                width: calc(50% - 10px);
                margin: 5px 5px;
                float: left;
            }
            .item-grid{
                grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
                gap: 5px;
                padding: 5px;
            }
            .crafting-plan-layout{
                flex-direction: column;
            }
            .crafting-plan-result{
                flex-basis: auto;
                width: 100%;
            }
            .mobile-only{
                display: block;
                width: calc(100% - 10px) !important;
                margin: 5px 5px;
                text-align: center;
                margin-top: 10px !important;
                font-size: 150% !important;
            }
            .mobile-hidden{
                display: none !important;
            }
            #terminalOptions > section{
                display: none;
            }
            #terminalsubcontainersettings > section{
                display: none;
                font-size: 150%;
            }
            #terminalSettingsView{
                padding: 8px;
            }
            #terminalSettingsView .settings-controls{
                font-size: 150%;
            }
        }
    </style>

<script>
    document.cookie = "cookiesAccepted=true; max-age=" + 60 * 60 * 24 * 7 + "; path=/";
    const username = "_REPLACE_ME_USERNAME";
    const isAdmin = _REPLACE_ME_IS_ADMIN;
    const isOutdated = _REPLACE_ME_VERSION_OUTDATED;
    const iconsEnabled = _REPLACE_ME_ICONS_ENABLED;
    document.getElementById('username').innerText = username;
    selectedGrid = -1;
    globalItemList = {};
    globalCPUList = {};
    currentWindow = 0; // 0 - main, 1 - CPU, 2 - Order screen, 3 - History window
    selectedCPU = 0;
    filteringOptions = {
        searchString: "",
        storedCraftable: 2, // 0 - stored, 1 - craftable, 2 - both
    };
    sortingOptions = {
        sortBy: 0,          // 0 - AZ, 1 - number of items, 2 - mod
        sortOrder: 0,       // 0 - ascending, 1 - descending
    };
    settings = {
        defaultGrid: -1, // -1 means no default grid
        autoRefresh: false,
        showItemIcon: false
    }
    const screens = [
        ["terminalOptions", "terminalTerminalHeader"],
        ["terminalCPUList", "terminalCPUHeader"],
        ["terminalCPUListForJob", "terminalJobHeader"],
        ["terminalHistoryHeader", "terminalHistoryDetails"],
        ["terminalSettingsView"],
    ];
    const sortByDisplay = ['A-Z', '# of items', 'Mod'];
    const sortOrderDisplay = ['Ascending', 'Descending'];
    const storedCraftableDisplay = ['Stored', 'Craftable', 'Stored and craftable'];

    const BYTE_UNIT = [ "B", "KB", "MB", "GB", "TB", "PB", "EB", "ZB", "YB", "BB" ];
    const BYTE_LIMIT = [ 1.0, 1024.0, 1048576.0, 1.073741824E9, 1.099511627776E12, 1.125899906842624E15, 1.15292150460684698E18, 1.1805916207174113E21, 1.2089258196146292E24, 1.2379400392853803E27 ];

    currentJob = {
        id: -1,
        itemHash: -1,
        finalOutput: null,
        bytesTotal: -1,
    }
    function searchStringChanged(el){
        let text = el.value;
        filteringOptions.searchString = text.toLowerCase();
        displayItemList();
    }
    function sortItemList(){
        let sortOrder = sortingOptions.sortOrder == 1 ? -1 : 1;
        if (sortingOptions.sortBy == 0){
            globalItemList.sort(function(i1,i2){
                return skipSpecialFormat(i1['itemname']).localeCompare(skipSpecialFormat(i2['itemname'])) * sortOrder;
            });
        }
        else if(sortingOptions.sortBy == 1){
            globalItemList.sort(function(i1,i2){
                return (i1['quantity'] - i2['quantity']) * sortOrder;
            });
        }
        else if(sortingOptions.sortBy == 2){
            globalItemList.sort(function(i1,i2){
                let mod1 = i1['itemid'].substring(0, i1['itemid'].indexOf(':'));
                let mod2 = i2['itemid'].substring(0, i2['itemid'].indexOf(':'));
                return mod1.localeCompare(mod2) * sortOrder;
            });
        }
    }
    function shouldDisplay(item){
        if (filteringOptions.storedCraftable != 2
            && item['craftable'] != (filteringOptions.storedCraftable == 1)){
            return false;
        }
        if (filteringOptions.searchString && filteringOptions.searchString != ""){
            return item['itemname'].toLowerCase().indexOf(filteringOptions.searchString) !== -1;
        }
        return true;
    }
    function changeSortingBy(el){
        sortingOptions.sortBy++;
        if (sortingOptions.sortBy > 2) sortingOptions.sortBy = 0;
        el.innerHTML = sortByDisplay[sortingOptions.sortBy];
        sortItemList();
        displayItemList();
        setCookie("sortBy", sortingOptions.sortBy, 7);
    }
    function changeStoredCraftable(el){
        filteringOptions.storedCraftable++;
        if (filteringOptions.storedCraftable > 2) filteringOptions.storedCraftable = 0;
        el.innerHTML = storedCraftableDisplay[filteringOptions.storedCraftable];
        displayItemList();
        setCookie("storedCraftable", filteringOptions.storedCraftable, 7);
    }
    function changeSortOrder(el){
        sortingOptions.sortOrder++;
        if (sortingOptions.sortOrder > 1) sortingOptions.sortOrder = 0;
        el.innerHTML = sortOrderDisplay[sortingOptions.sortOrder];
        sortItemList();
        displayItemList();
        setCookie("sortOrder", sortingOptions.sortOrder, 7);
    }
    function changeAutoRefresh(el){
        settings.autoRefresh = el.checked;
        setCookie("autoRefresh", settings.autoRefresh ? 1 : 0, 7);
    }
    function changeShowItemIcon(el){
        settings.showItemIcon = el.checked;
        setCookie("showItemIcon", settings.showItemIcon ? 1 : 0, 7);
        refreshDisplay();
    }
    function onThisGridByDefaultChange(el) {
        settings.defaultGrid = el.checked ? selectedGrid : -1;
        setCookie("defaultGrid", settings.defaultGrid, 7);
    }
    function onTrackThisGridChange(el) {
        if (selectedGrid == -1) return;
        let trackThisGrid = el.checked;
        getJSONWithGridRefresh('gridsettings?grid=' + selectedGrid + '&track=' + (trackThisGrid ? '1' : '0'), function(data) {
            data = data.data;
            el.checked = data['isTracked'];
            updateGridList();
        }, function(data) {
            showAlert(data.status + ": " + data.data);
        });
    }
    function refreshTerminal() {
        if (currentWindow == 0)
            getItemList();
        else if (currentWindow == 1)
            displayCPUDetails();
        else if (currentWindow == 2)
            updateCraftingPlan();
        else if (currentWindow == 3)
            getCraftingHistory();
    }
    function refreshDisplay(){
        if (currentWindow == 0)
            displayItemList();
    }
    function setCookie(cname, cvalue, exdays) {
        const d = new Date();
        d.setTime(d.getTime() + (exdays * 24 * 60 * 60 * 1000));
        let expires = "expires="+d.toUTCString();
        document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
    }
    function getCookie(cname) {
        let name = cname + "=";
        let ca = document.cookie.split(';');
        for(let i = 0; i < ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) == ' ') {
                c = c.substring(1);
            }
            if (c.indexOf(name) == 0) {
                return c.substring(name.length, c.length);
            }
        }
        return "";
    }
    function initSettings(){
        let cookie = getCookie("defaultGrid");
        if (cookie != "")
            settings.defaultGrid = Number(cookie);
        cookie = getCookie("sortBy");
        if (cookie != "")
            sortingOptions.sortBy = Number(cookie);
        cookie = getCookie("storedCraftable");
        if (cookie != "")
            filteringOptions.storedCraftable = Number(cookie);
        cookie = getCookie("sortOrder");
        if (cookie != "")
            sortingOptions.sortOrder = Number(cookie);
        cookie = getCookie("autoRefresh");
        if (cookie != "")
            settings.autoRefresh = Number(cookie) == 1;
        cookie = getCookie("showItemIcon");
        if (cookie != "")
            settings.showItemIcon = Number(cookie) == 1;
        document.getElementById('sortByButton').innerHTML = sortByDisplay[sortingOptions.sortBy];
        document.getElementById('storedCraftableButton').innerHTML = storedCraftableDisplay[filteringOptions.storedCraftable];
        document.getElementById('sortOrderButton').innerHTML = sortOrderDisplay[sortingOptions.sortOrder];
        document.getElementById('autorefresh').checked = settings.autoRefresh;
        document.getElementById('showitemicon').disabled = !iconsEnabled;
        if (!iconsEnabled) settings.showItemIcon = false;
        document.getElementById('showitemicon').checked = settings.showItemIcon;
        selectedGrid = settings.defaultGrid;
    }
    initSettings();
    function formatBytes(bytes) {
        for (let i = 1; i < 10; i++) {
            if (bytes < BYTE_LIMIT[i]) {
                return (bytes / BYTE_LIMIT[i - 1]) + " " + BYTE_UNIT[i - 1];
            }
        }
        return (bytes / BYTE_LIMIT[0]) + " " + BYTE_UNIT[0];
    }
    function formatNumber(num){
        return num.toLocaleString();
    }
    // Matches AE2's ReadableNumberConverter.toWideReadableForm: a maximum of four characters,
    // a single truncated decimal when it fits, and the postfix sequence kMGTPE.
    function formatGridNumber(num){
        let value = Math.trunc(Number(num));
        if (!Number.isFinite(value) || value < 0) return String(num);
        if (String(value).length <= 4) return String(value);

        const postfixes = 'kMGTPE';
        let displayed = value;
        let scaled = value;
        let postfixIndex = -1;
        do {
            displayed = scaled;
            scaled = Math.floor(scaled / 1000);
            postfixIndex++;
        } while (String(scaled).length + 1 > 4 && postfixIndex < postfixes.length - 1);

        const postfix = postfixes[postfixIndex];
        const withDecimal = (Math.floor((displayed / 1000) * 10) / 10).toFixed(1).replace(/\.0$/, '') + postfix;
        const withoutDecimal = String(scaled) + postfix;
        return withDecimal.length <= 4 ? withDecimal : withoutDecimal;
    }
    function formatTime(time){
        let s = Number(time) / 1000;
        let format = 's';
        if(s > 60){
            s /= 60;
            format = 'm';
        }
        if(s > 60){
            s /= 60;
            format = 'h';
        }
        return Intl.NumberFormat(undefined, {
                    maximumFractionDigits: 3
                }).format(s) + format;
    }
    function formatPercent(percent){
        return Intl.NumberFormat(undefined, {
            style: "percent",
            maximumFractionDigits: 2
        }).format(percent);
    }
    const extraSpecialFormatChars = "klmno";
    const extraSpecialFormatResetChar = 'r';
    function parseSpecialFormat(itemName) {
        let formattedItemName = "";
        let spanCounter = 0;
        let extraSpecialCounter = 0;
        for (let i = 0; i < itemName.length; i++){
            char = itemName[i];
            if (char == '§'){
                let specialChar = itemName[++i];
                if (extraSpecialFormatChars.indexOf(specialChar) != -1) {
                    extraSpecialCounter++;
                }
                else if (specialChar == extraSpecialFormatResetChar) {
                    for (let j = 0; j < spanCounter; j++){
                        formattedItemName += "</span>";
                    }
                    spanCounter = 0;
                    extraSpecialCounter = 0;
                    continue;
                }
                else if (extraSpecialCounter > 0) {
                    for (let j = 0; j < extraSpecialCounter; j++){
                        formattedItemName += "</span>";
                    }
                    spanCounter -= extraSpecialCounter;
                    extraSpecialCounter = 0;
                }
                formattedItemName += "<span class='minecraftSpecialFormat_" + specialChar + "'>";
                spanCounter++;
            }
            else
            {
                formattedItemName += char;
            }
        }
        for (let i = 0; i < spanCounter; i++){
            formattedItemName += "</span>";
        }
        return formattedItemName;
    }
    function skipSpecialFormat(itemName) {
        if (itemName.indexOf('§') == -1){
            return itemName;
        }
        let skippedItemName = "";
        for (let i = 0; i < itemName.length; i++){
            char = itemName[i];
            if (char == '§'){
                i++;
                continue;
            }
            skippedItemName += char;
        }
        return skippedItemName;
    }
        function formatItemName(itemObject, allowNewLines=true) {
        let itemName = '<b>' + itemObject['itemname'] + '</b>';
        if (itemName.indexOf('§') != -1){
            itemName = parseSpecialFormat(itemName);
        }
        let html = itemName;
        return html;
        }
        function getItemIconMarkup(item, iconsToFetch) {
            if (!settings.showItemIcon || !item) return '';
            let image = getIcon(item);
            if (image === null){
                iconsToFetch.push(item);
                image = '';
            }
            else image = "data:image/png;base64," + image;
            return "<img class='item-icon' data-icon-hash='" + item['hashcode'] + "' src='" + image + "' />";
        }
        function getWebsiteOriginIconMarkup() {
            return "<span class='website-origin-icon' title='Started from website' aria-label='Started from website'>&#127760;</span>";
        }
        const scheduledReasonText = {
            SOMETHING_STUCK: "Target is full or can't accept the ingredients",
            BLOCKING_MODE: "Blocking Mode",
            LOCK_MODE: "Lock Mode",
            NO_TARGET: "Can't find a target to push to",
            NOT_ENOUGH_INGREDIENTS: "Not enough ingredients",
            SAME_NETWORK: "Target interface is in the same network",
            UNSUPPORTED_STACK: "Contains a stack that is not supported by any target around the interface"
        };
        function getScheduledReasonMarkup(item) {
            const reason = scheduledReasonText[item['scheduledReason']];
            return reason ? "<br><span class='scheduled-reason'>" + reason + "</span>" : "";
        }
        function getCraftingCardClass(item) {
            if (item['scheduledReason'] === 'SOMETHING_STUCK') return 'reason-stuck';
            if (item['scheduledReason'] === 'UNSUPPORTED_STACK'
                || item['scheduledReason'] === 'SAME_NETWORK'
                || item['scheduledReason'] === 'NO_TARGET') return 'reason-error';
            if (item['active'] > 0) return 'active';
            if (item['pending'] > 0) return 'pending';
            return 'storage';
        }
        function displayCPUList(){
            let html = "";
            let iconsToFetch = [];
            for (let key in globalCPUList){
                let cluster = globalCPUList[key];
            html += "<button onclick='selectCPU(this);' name='" + key + "' ";
            if (selectedCPU == key)
                html += "class='selected'";
            html += "><div class='cpu-name-line'>";
            if (cluster['startedFromWebsite']) html += getWebsiteOriginIconMarkup();
            html += key + "</div>";
            if (cluster['finalOutput'])
                html += "<div class='cpu-job-line'>" + getItemIconMarkup(cluster['finalOutput'], iconsToFetch) + "<div class='cpu-job-details'>" + formatItemName(cluster['finalOutput'], false) + " x" + formatNumber(cluster['finalOutput']['quantity']) + "</div></div>";
            html += "</button>";
        }
        document.getElementById('terminalCPUList').innerHTML = html;
        if (settings.showItemIcon && iconsToFetch.length > 0) fetchIcons(iconsToFetch);
    }
    function displayCPUDetails(){
        if (selectedGrid == -1)
            return;
        if (Object.keys(globalCPUList).length == 0) return;
        let message = "Asking for " + selectedCPU + "...";
        pushLoadingScreen(message);
        $.getJSON('get?grid=' + selectedGrid + '&cpu=' + encodeURIComponent(selectedCPU).replace(/'/g,"%27").replace(/"/g,"%22"), function(data){
            console.log(data);
            if (data.status !== "OK"){
                showAlert(data.status + ": " + data.data);
                popLoadingScreen(message);
                return;
            }
            data = data.data;
            let html = "";
            let iconsToFetch = [];
            let cpuTitlePrefix = data['startedFromWebsite'] ? getWebsiteOriginIconMarkup() + " " : "";
            if (data['finalOutput'])
                document.getElementById("terminalCPUHeaderText").innerHTML =
                    cpuTitlePrefix + selectedCPU + ": Crafting " + formatItemName(data['finalOutput'], false) + " x" + formatNumber(data['finalOutput']['quantity']);
            else
                document.getElementById("terminalCPUHeaderText").innerHTML = cpuTitlePrefix + selectedCPU + ": Idle";
            let hasTrackingInfo = data['hasTrackingInfo'];
            if (data['items'] && data['items'].length > 0) {
                document.getElementById("cancelJobOnCPUButton").style.display = 'block';
                html += "<div class='item-grid'>";
                if (data['items']){
                    let items = data['items'];
                    for(let i = 0; i < items.length; i++){
                        let item = items[i];

    // The async endpoints (trackinghistory / gettracking / gridsettings) authorize against a per-user
    // access set that the server rebuilds during synced requests. After a long idle period it expires and
    // the server answers REFRESH_REQUIRED instead of serving the request. Asking for the grid list rebuilds
    // that set, so retry once before bothering the user with an error.
    function getJSONWithGridRefresh(url, onSuccess, onFailure){
        $.getJSON(url, function(data){
            if (data.status === "REFRESH_REQUIRED"){
                updateGridList(function(){
                    $.getJSON(url, function(retried){
                        if (retried.status !== "OK"){
                            onFailure(retried);
                            return;
                        }
                        onSuccess(retried);
                    });
                });
                return;
            }
            if (data.status !== "OK"){
                onFailure(data);
                return;
            }
            onSuccess(data);
        });
    }

    function isValidCPUForOrder(cluster) {
        // An idle CPU still has to hold the whole plan. Only the merge case used to be measured, so a
        // too-small idle CPU passed here and AE2 refused the job afterwards without saying anything.
        // isBusy is the flag the server actually reports; finalOutput is only filled in when busy.
        if (!cluster['isBusy']) return cluster['availableStorage'] >= currentJob.bytesTotal;
        if (!cluster['finalOutput']) return false;
        if (currentJob.itemHash != cluster['finalOutput']['hashcode']) return false;
        if (cluster['usedStorage'] == -1) return false;
        return cluster['availableStorage'] >= cluster['usedStorage'] + currentJob.bytesTotal;
    }

    function beginOrderingItem(hashcode){
        if (selectedGrid == -1)
            return;
        console.log(hashcode);
        let answer = window.prompt("How much to order?", "1");
        if (answer === null) // cancelled
            return;
        let quantity = Number(answer);
        // Number.isInteger rejects NaN, fractions and Infinity in one go. The old check compared against
        // NaN with ==, which is always false, so anything non-numeric slipped through and was sent to the
        // server as the literal "NaN".
        // The ceiling is JavaScript's own, not the server's: it accepts a long, but a Number cannot hold
        // an exact integer past MAX_SAFE_INTEGER, so a bigger figure would quietly become a different one.
        if (!Number.isInteger(quantity) || quantity <= 0 || quantity > Number.MAX_SAFE_INTEGER){
            showAlert("Enter a whole number between 1 and " + Number.MAX_SAFE_INTEGER + ".");
            return;
        }
        else {
            document.getElementById('terminalCPUListForJob').innerHTML = "...";
            let message = "Sending order...";
            pushLoadingScreen(message);
            $.getJSON('order?grid=' + selectedGrid + '&item=' + hashcode + "&quantity=" + quantity, function(data){

                    return;

        pushLoadingScreen(message);
        $.getJSON('cancelcpu?grid=' + selectedGrid + '&cpu=' + encodeURIComponent(selectedCPU).replace(/'/g,"%27").replace(/"/g,"%22"), function(data){
            updateCPUList();
            refreshTerminal();
            popLoadingScreen(message);
        });
    }

    // --- Item icon cache -------------------------------------------------------
    // Icons live in IndexedDB, not localStorage: browsers cap localStorage at roughly 5 MB per
    // origin, which a real network's icon set outgrows within a single session. IndexedDB quotas
    // are far larger. A small in-memory mirror keeps list rendering synchronous.
    let iconMemCache = {};          // hashcode -> base64 png (only icons that really exist)
    const iconMissingThisSession = {}; // hashcodes answered with the placeholder; not re-requested
    let iconDbPromise = null;
    // Must stay identical to the placeholder embedded in IconStore on the server.
    const ICON_PLACEHOLDER_PNG_BASE64 = "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAGklEQVR42mNYsWLFf0oww6gBowaMGjBcDAAAk9v3H//7IkQAAAAASUVORK5CYII=";

    function openIconDatabase(){
        if (iconDbPromise === null){
            iconDbPromise = new Promise(function(resolve, reject){
                const request = indexedDB.open("ae2webintegration", 1);
                request.onupgradeneeded = function(){ request.result.createObjectStore("icons"); };
                request.onsuccess = function(){ resolve(request.result); };
                request.onerror = function(){ reject(request.error); };
            });
        }
        return iconDbPromise;
    }

    function idbGetIcons(hashcodes){ // Promise of {hashcode: base64 png}
        return openIconDatabase().then(function(db){
            return new Promise(function(resolve, reject){
                const result = {};
                const tx = db.transaction("icons", "readonly");
                const store = tx.objectStore("icons");
                for(let i = 0; i < hashcodes.length; i++){
                    const req = store.get("itemIcon" + hashcodes[i]);
                    req.onsuccess = function(){ if (req.result !== undefined) result[hashcodes[i]] = req.result; };
                }
                tx.oncomplete = function(){ resolve(result); };
                tx.onerror = function(){ reject(tx.error); };
            });
        }).catch(function(){ return {}; }); // no IndexedDB (private mode etc.): degrade to always-fetch
    }

    function idbPutIcons(entries){ // entries: [{hashcode, pngData}]
        return openIconDatabase().then(function(db){
            return new Promise(function(resolve){
                const tx = db.transaction("icons", "readwrite");
                const store = tx.objectStore("icons");
                for(let i = 0; i < entries.length; i++){
                    store.put(entries[i]['pngData'], "itemIcon" + entries[i]['hashcode']);
                }
                tx.oncomplete = function(){ resolve(); };
                tx.onerror = function(){ resolve(); }; // quota errors must never break the UI
            });
        }).catch(function(){});
    }

    function idbClearIcons(){
        return openIconDatabase().then(function(db){
            return new Promise(function(resolve){
                const tx = db.transaction("icons", "readwrite");
                tx.objectStore("icons").clear();
                tx.oncomplete = function(){ resolve(); };
                tx.onerror = function(){ resolve(); };
            });
        }).catch(function(){});
    }

    function purgeIconCache(){
        if (!confirm('Are you sure you want to purge icons cache? This will result all icons to be redownloaded!')) return;
        idbClearIcons().then(function(){
            iconMemCache = {};
            location.reload();
        });
    }

    function getIcon(item) {
        return iconMemCache[item['hashcode']] || null;
    }

    // Patches already-rendered <img> elements once icons become available.
    function applyIcons(byHash) {
        for (const hash in byHash){
            if (!(byHash.hasOwnProperty(hash))) continue;
            const images = document.querySelectorAll("img.item-icon[data-icon-hash='" + hash + "']");
            for (let i = 0; i < images.length; i++) images[i].src = "data:image/png;base64," + byHash[hash];
        }
    }

    function fetchIcons(items) {
        let hashes = [];
        for(let i = 0; i < items.length; i++){
            hashes.push(items[i]['hashcode']);
        }
        idbGetIcons(hashes).then(function(cached){
            applyIcons(cached);
            for (const hash in cached){
                iconMemCache[hash] = cached[hash];
            }
            const missing = hashes.filter(function(hash){
                return !(hash in iconMemCache) && !(hash in iconMissingThisSession);
            });
            if (missing.length === 0) return;
            $.getJSON('icon?items=' + missing.join(','), function(data){
                if (data.status !== "OK"){
                    showAlert(data.status + ": " + data.data);
                    return;
                }
                data = data.data;
                const fetched = [];
                const byHash = {};
                for(let i = 0; i < data.length; i++){
                    const entry = data[i];
                    byHash[entry['hashcode']] = entry['pngData'];
                    if (entry['pngData'] === ICON_PLACEHOLDER_PNG_BASE64){
                        // No rendered icon exists server-side; remember it so auto-refresh
                        // does not request this item again until the page is reloaded.
                        iconMissingThisSession[entry['hashcode']] = true;
                        continue;
                    }
                    iconMemCache[entry['hashcode']] = entry['pngData'];
                    fetched.push(entry);
                }
                idbPutIcons(fetched);
                applyIcons(byHash);
            });
        });
    }

    function autoRefresher(){
        setTimeout(autoRefresher, 10000);
        if (loadingMessages.length > 0)
            return;
        updateCPUList();
        if (settings.autoRefresh){
            refreshTerminal();
        }
    }
    setTimeout(autoRefresher, 10000);

    loadingMessages = [];

    function pushLoadingScreen(message){
        loadingMessages.push(message);
        updateLoadingDisplay();
    }
    function popLoadingScreen(message){
        let i = loadingMessages.indexOf(message);
        if (i > -1){
            loadingMessages.splice(i, 1);
        }
        updateLoadingDisplay();
    }

    function updateLoadingDisplay(){
        if (loadingMessages.length > 0){
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('overlaytext').textContent = loadingMessages[loadingMessages.length - 1];
        }
        else
            document.getElementById('overlay').style.display = 'none';
    }

    updateCPUList();
    getItemList();

    function showAlertIfOutdated() {
        if (isOutdated && isAdmin){
            if (getCookie("DoNotShowUpdateMessage") == 1) return;
            pushTopMessage("<span>New version detected! Consider updating from <a href='https://github.com/kuba6000/AE2-Web-Integration/releases/'>github</a></span> <button onclick='closeTopMessage(this.parentElement);'>Close</button><button onclick='updateDoNotShowAgain(this.parentElement);'>Hide for 7 days</button><br style='clear: both;'/>");
        }
        else
        {
            setCookie("DoNotShowUpdateMessage", 0, 0);
        }
    }
    setTimeout(showAlertIfOutdated, 100);

    function updateDoNotShowAgain(el){
        setCookie("DoNotShowUpdateMessage", 1, 7);
        closeTopMessage(el);
    }

    function showAlert(text){
        let o = document.getElementById('alertoverlay');
        o.innerHTML = "<section onclick='this.remove();'>" + text + "</section>" + o.innerHTML;
    }

    topMessages = [];
    function pushTopMessage(message){
        topMessages.push(message);
        updateTopMessages();
    }

    function popTopMessage(i){
        topMessages.splice(i, 1);
        updateTopMessages();
    }

    function closeTopMessage(el){
        let message = el.getAttribute('topMessageID');
        popTopMessage(message);
    }

    function updateTopMessages(){
        let html = "";
        let i = 0;
        for(let message of topMessages){
            html += '<section topMessageID=' + i + '>' + message + '</section>';
            i++;
        }
        document.getElementById('topMessages').innerHTML = html;

        $("#topMessagesContainer").height($("#topMessages").height());
    }


    // make collapsible work
    let coll = document.getElementsByClassName("collapsible");

    for (let i = 0; i < coll.length; i++) {
        coll[i].addEventListener("click", function() {
            this.classList.toggle("active");
            var content = this.nextElementSibling;
            if (content.style.display === "block") {
                content.style.display = "none";
            } else {
                content.style.display = "block";
            }
        });
    }

</script>
</body>
</html>
